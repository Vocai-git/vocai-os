<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOCAI OS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1c2333;
      --surface: #242d3f;
      --sidebar: #141a27;
      --blue: #4d8ef0;
      --teal: #38bfa8;
      --amber: #e8a94d;
      --rose: #e06b72;
      --violet: #9d7fe8;
      --text: #e8edf5;
      --text-muted: #7a8aaa;
      --border: #2e3a52;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(77,142,240,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(157,127,232,0.06) 0%, transparent 60%);
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--blue), var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-logo-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
    }

    .login-title {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: var(--text);
      transition: border-color 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--blue);
    }

    .form-input::placeholder { color: var(--text-muted); }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--blue), #3a7be0);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login:hover { opacity: 0.92; }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      background: rgba(224,107,114,0.12);
      border: 1px solid rgba(224,107,114,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--rose);
      margin-top: 16px;
      display: none;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <div class="login-logo-text">VOCAI</div>
      <div class="login-logo-sub">Sistema Operativo</div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Bienvenido</h1>
      <p class="login-subtitle">Accede a tu panel de gestión</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="tu@vocai.es" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="btn-login" type="submit" id="btnLogin">Entrar</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>

    <div class="footer-text">VOCAI OS · Alicante, España · © 2024</div>
  </div>

  <script>
    // Check if already logged in
    const token = localStorage.getItem('vocai_token');
    if (token) window.location.href = '/app';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorMsg = document.getElementById('errorMsg');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Entrando...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');

        localStorage.setItem('vocai_token', data.token);
        localStorage.setItem('vocai_refresh_token', data.refresh_token);
        localStorage.setItem('vocai_user', JSON.stringify(data.user));

        window.location.href = '/app';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
