<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOCAI OS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/img/logo.png">
  <style>
    /* Mismo diseño que el panel nuevo (public/css/panel.css): navy, azul, Inter. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: #141d35;
      color: #e0e4ec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .login-wrapper { width: 100%; max-width: 400px; }

    .login-logo { text-align: center; margin-bottom: 28px; }

    .login-logo-marca {
      display: inline-block;
      font-weight: 800;
      font-size: 40px;
      line-height: 1.1;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #2979FF, #FF6B6B);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .login-logo-sub { font-size: 13px; color: #9ca3af; margin-top: 6px; }

    .login-card {
      background: #1e2a47;
      border: 1px solid #2b3c60;
      border-radius: 14px;
      padding: 28px 24px;
    }

    .login-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }

    .login-subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 24px; }

    .form-group { margin-bottom: 16px; }

    .form-label { display: block; font-size: 12px; font-weight: 500; color: #9ca3af; margin-bottom: 6px; }

    .form-input {
      width: 100%;
      background: #141d35;
      border: 1px solid #2b3c60;
      border-radius: 8px;
      padding: 12px 14px;
      font: 400 15px Inter, sans-serif;
      color: #e0e4ec;
      color-scheme: dark;
    }

    .form-input:focus { outline: 2px solid #2979FF; outline-offset: -1px; }

    .form-input::placeholder { color: #5b6784; }

    /* El autocompletado del navegador pinta el campo de blanco: se mantiene el fondo del panel. */
    .form-input:-webkit-autofill, .form-input:-webkit-autofill:focus {
      -webkit-text-fill-color: #e0e4ec;
      box-shadow: 0 0 0 1000px #141d35 inset;
      caret-color: #e0e4ec;
    }

    .btn-login {
      width: 100%;
      background: #2979FF;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 13px;
      font: 600 15px Inter, sans-serif;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-login:hover { background: #1f6bf0; }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      background: rgba(255, 107, 107, .14);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #FF6B6B;
      margin-top: 14px;
      display: none;
    }

    .footer-text { text-align: center; margin-top: 22px; font-size: 12px; color: #6b7690; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <div class="login-logo-marca">VOCAI</div>
      <div class="login-logo-sub">Panel de gestión</div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Bienvenido</h1>
      <p class="login-subtitle">Entra con tu cuenta de VOCAI</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="tu@vocai.es" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="btn-login" type="submit" id="btnLogin">Entrar</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>

    <div class="footer-text">VOCAI OS · Alicante, España · © 2024</div>
  </div>

  <script>
    // Check if already logged in
    // Quien llega desde el panel nuevo (?ir=/panel...) vuelve ahí; el resto entra a /app como siempre.
    const pedido = new URLSearchParams(location.search).get('ir') || '';
    const destino = ['/panel', '/panel/clientes'].includes(pedido) ? pedido : '/app';
    const token = localStorage.getItem('vocai_token');
    if (token) window.location.href = destino;

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorMsg = document.getElementById('errorMsg');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Entrando...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');

        localStorage.setItem('vocai_token', data.token);
        localStorage.setItem('vocai_refresh_token', data.refresh_token);
        localStorage.setItem('vocai_user', JSON.stringify(data.user));

        window.location.href = destino;
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
