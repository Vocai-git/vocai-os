<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOCAI OS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #111111;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper { width: 100%; max-width: 380px; }

    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo img {
      width: 140px;
      display: block;
      margin: 0 auto;
    }

    .login-logo-sub {
      font-size: 11px;
      color: #555;
      margin-top: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .login-card {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 32px 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .login-title {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-input {
      width: 100%;
      background: #111111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 13px 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      color: #fff;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: #FF6B6B;
      box-shadow: 0 0 0 2px rgba(255,107,107,0.1);
    }

    .form-input::placeholder { color: #333; }

    .btn-login {
      width: 100%;
      background: #FF6B6B;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }

    .btn-login:hover { opacity: 0.88; }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.4; cursor: not-allowed; }

    .error-msg {
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.2);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      color: #FF6B6B;
      margin-top: 14px;
      display: none;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #333;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <img src="/img/logo.png" alt="VOCAI" style="width:120px; display:block; margin:0 auto; mix-blend-mode:screen">
      <div class="login-logo-sub">Sistema Operativo</div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Bienvenido</h1>
      <p class="login-subtitle">Accede a tu panel de gestión</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="tu@vocai.es" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="btn-login" type="submit" id="btnLogin">Entrar</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>

    <div class="footer-text">VOCAI OS · Alicante, España · © 2024</div>
  </div>

  <script>
    // Check if already logged in
    const token = localStorage.getItem('vocai_token');
    if (token) window.location.href = '/app';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorMsg = document.getElementById('errorMsg');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Entrando...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión');

        localStorage.setItem('vocai_token', data.token);
        localStorage.setItem('vocai_refresh_token', data.refresh_token);
        localStorage.setItem('vocai_user', JSON.stringify(data.user));

        window.location.href = '/app';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
